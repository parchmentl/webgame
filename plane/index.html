<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>飞机大战</title>
<style>
:root{
  --bg:#05070f;
  --panel:#0c1120;
  --line:#1c2740;
  --cyan:#22d3ee;
  --magenta:#ff2d78;
  --acid:#a3e635;
  --amber:#fbbf24;
  --red:#f43f5e;
  --text:#e8ecf6;
  --dim:#8b93a8;
}
*{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}

#app{
  height:100vh;height:100dvh;
  max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  gap:8px;
}

/* ===== 顶部 HUD ===== */
#hud{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(180deg,#0d1424,#0a0f1c);
  border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;
}
.hud-score{display:flex;flex-direction:column;line-height:1.15}
.hud-score .label{font-size:10px;color:var(--dim);letter-spacing:2px}
.hud-score .val{font-size:20px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(34,211,238,.5)}
.hud-score.best .val{font-size:13px;color:var(--amber);text-shadow:none;font-weight:600}
#hudWave{
  font-size:13px;font-weight:700;letter-spacing:1px;color:var(--magenta);
  border:1px solid rgba(255,45,120,.4);border-radius:999px;padding:4px 12px;
  background:rgba(255,45,120,.08);white-space:nowrap;
}
.hud-btns{display:flex;gap:6px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:#101830;color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,box-shadow .15s,transform .1s;
}
.icon-btn:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.35)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{color:var(--dim);border-color:#2a2030}

/* ===== 舞台 ===== */
#stage{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:#04060d;
}
canvas{display:block;touch-action:none;border-radius:13px}
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:13px;
  background:radial-gradient(ellipse at center,transparent 62%,rgba(2,4,10,.55) 100%);
}

/* ===== 波次横幅 ===== */
#banner{
  position:absolute;top:18%;left:50%;transform:translateX(-50%);
  pointer-events:none;opacity:0;z-index:5;
  font-size:26px;font-weight:900;letter-spacing:6px;white-space:nowrap;
  color:var(--cyan);text-shadow:0 0 18px rgba(34,211,238,.8);
}
#banner.boss{color:var(--red);text-shadow:0 0 18px rgba(244,63,94,.9)}
#banner.show{animation:bannerIn 2s ease forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:translateX(-50%) scale(1.6);letter-spacing:14px}
  18%{opacity:1;transform:translateX(-50%) scale(1)}
  75%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.96)}
}

/* ===== 覆盖层 ===== */
.overlay{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(4,6,13,.82);backdrop-filter:blur(6px);
  padding:20px;text-align:center;overflow-y:auto;
}
.overlay.hidden{display:none}
.game-title{
  font-size:44px;font-weight:900;letter-spacing:8px;line-height:1.1;
  background:linear-gradient(100deg,var(--cyan) 10%,#7dd3fc 40%,var(--magenta) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,211,238,.35));
}
.game-sub{font-size:12px;color:var(--dim);letter-spacing:3px}
.diff-row{display:flex;gap:8px;margin-top:4px}
.diff-btn{
  padding:8px 18px;border-radius:999px;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:#0e1526;color:var(--dim);
  transition:all .15s;
}
.diff-btn:hover{border-color:var(--cyan);color:var(--text)}
.diff-btn.sel{
  border-color:var(--cyan);color:#04121a;background:var(--cyan);font-weight:700;
  box-shadow:0 0 16px rgba(34,211,238,.5);
}
.help{
  font-size:12px;color:var(--dim);line-height:1.9;
  border:1px dashed var(--line);border-radius:10px;padding:10px 16px;max-width:320px;
}
.help b{color:var(--text);font-weight:600}
.help .k{
  display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:0 6px;margin:0 2px;font-size:11px;color:var(--cyan);background:#0e1526;
}
.big-btn{
  padding:13px 46px;border:none;border-radius:999px;cursor:pointer;
  font-size:18px;font-weight:800;letter-spacing:4px;color:#04121a;
  background:linear-gradient(100deg,var(--cyan),#67e8f9);
  box-shadow:0 0 24px rgba(34,211,238,.45),0 4px 0 #0e7490;
  transition:transform .1s,box-shadow .15s;
}
.big-btn:hover{box-shadow:0 0 34px rgba(34,211,238,.7),0 4px 0 #0e7490}
.big-btn:active{transform:translateY(3px);box-shadow:0 0 18px rgba(34,211,238,.4),0 1px 0 #0e7490}
.big-btn.mag{background:linear-gradient(100deg,var(--magenta),#fb7185);color:#2a0410;box-shadow:0 0 24px rgba(255,45,120,.45),0 4px 0 #9f1239}
.big-btn.mag:active{box-shadow:0 0 18px rgba(255,45,120,.4),0 1px 0 #9f1239}
.ghost-btn{
  padding:9px 26px;border-radius:999px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--dim);
  transition:all .15s;text-decoration:none;
}
.ghost-btn:hover{border-color:var(--cyan);color:var(--text)}
.best-line{font-size:13px;color:var(--amber)}
.over-score{font-size:52px;font-weight:900;color:var(--cyan);text-shadow:0 0 24px rgba(34,211,238,.6);font-variant-numeric:tabular-nums}
.over-title{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--red)}
.over-stats{display:flex;gap:22px;font-size:13px;color:var(--dim)}
.over-stats b{display:block;font-size:18px;color:var(--text);margin-top:2px}
.new-record{
  font-size:13px;font-weight:800;color:#04121a;background:var(--amber);
  padding:4px 14px;border-radius:999px;letter-spacing:2px;
  animation:pulseRec 1s ease infinite alternate;
}
@keyframes pulseRec{from{box-shadow:0 0 8px rgba(251,191,36,.5)}to{box-shadow:0 0 22px rgba(251,191,36,.95)}}
.pause-title{font-size:28px;font-weight:800;letter-spacing:8px;color:var(--cyan)}

/* ===== 底部状态坞 ===== */
#dock{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,#0d1424,#0a0f1c);
  border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;min-height:56px;
}
.dock-group{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.dock-label{font-size:10px;color:var(--dim);letter-spacing:2px}
#lives{font-size:16px;letter-spacing:2px;min-height:20px;white-space:nowrap}
#weapon{display:flex;gap:4px;min-height:20px;align-items:center}
.wpip{width:14px;height:6px;border-radius:3px;background:#1c2740}
.wpip.on{background:var(--acid);box-shadow:0 0 8px rgba(163,230,53,.7)}
#bombBtn{
  display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;
  padding:9px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;
  border:1px solid rgba(251,191,36,.5);background:rgba(251,191,36,.1);color:var(--amber);
  transition:all .15s;
}
#bombBtn:hover:not(:disabled){background:rgba(251,191,36,.22);box-shadow:0 0 14px rgba(251,191,36,.4)}
#bombBtn:active:not(:disabled){transform:scale(.94)}
#bombBtn:disabled{opacity:.35;cursor:default}
#bombBtn .cnt{font-variant-numeric:tabular-nums}
#dockHint{font-size:11px;color:var(--dim);text-align:right;line-height:1.5}
@media (max-width:430px){
  #dockHint{display:none}
  .game-title{font-size:34px;letter-spacing:5px}
  #hudWave{font-size:11px;padding:3px 8px}
}
</style>
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-score">
      <span class="label">得分</span>
      <span class="val" id="score">0</span>
    </div>
    <div class="hud-score best">
      <span class="label">最高</span>
      <span class="val" id="best">0</span>
    </div>
    <div id="hudWave">第 1 波</div>
    <div class="hud-btns">
      <button class="icon-btn" id="pauseBtn" title="暂停 (P)">⏸</button>
      <button class="icon-btn" id="muteBtn" title="声音 (M)">🔊</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="banner"></div>

    <div class="overlay" id="menu">
      <div class="game-title">飞机大战</div>
      <div class="game-sub">NEON RAID · 霓虹突袭</div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="casual">休闲</button>
        <button class="diff-btn sel" data-diff="normal">标准</button>
        <button class="diff-btn" data-diff="hard">噩梦</button>
      </div>
      <div class="help">
        <b>电脑</b>：<span class="k">↑↓←→</span>/<span class="k">WASD</span> 移动 · 自动开火<br>
        <span class="k">B</span> 炸弹 · <span class="k">P</span> 暂停 · <span class="k">M</span> 静音<br>
        <b>手机</b>：拖动屏幕驾驶战机，自动开火<br>
        每 5 波遭遇 <b style="color:var(--red)">BOSS</b> · 吃道具强化火力
      </div>
      <div class="best-line">最高分 <span id="menuBest">0</span></div>
      <button class="big-btn" id="startBtn">开始出击</button>
      <a class="ghost-btn" href="../">← 返回游戏厅</a>
    </div>

    <div class="overlay hidden" id="pauseOv">
      <div class="pause-title">已暂停</div>
      <button class="big-btn" id="resumeBtn">继续作战</button>
      <button class="ghost-btn" id="pauseRestartBtn">重新开始</button>
    </div>

    <div class="overlay hidden" id="overOv">
      <div class="over-title">战机坠毁</div>
      <div class="over-score" id="overScore">0</div>
      <div class="new-record hidden" id="newRecord">★ 新纪录 ★</div>
      <div class="over-stats">
        <div>抵达波次<b id="overWave">1</b></div>
        <div>击坠数<b id="overKills">0</b></div>
        <div>最高分<b id="overBest">0</b></div>
      </div>
      <button class="big-btn mag" id="retryBtn">再次出击</button>
      <a class="ghost-btn" href="../">← 返回游戏厅</a>
    </div>
  </div>

  <footer id="dock">
    <div class="dock-group">
      <span class="dock-label">机体</span>
      <span id="lives">❤️❤️❤️</span>
    </div>
    <div class="dock-group">
      <span class="dock-label">火力</span>
      <div id="weapon"><span class="wpip on"></span><span class="wpip"></span><span class="wpip"></span></div>
    </div>
    <button id="bombBtn" title="炸弹 (B)">💣 炸弹 <span class="cnt" id="bombCnt">×2</span></button>
    <div id="dockHint">拖动 / 方向键移动<br>自动开火 · B 炸弹</div>
  </footer>

</div>
<script src="game.js"></script>
</body>
</html>
