<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暮色飞鸟 · Flappy Bird</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora a1"></div>
<div class="aurora a2"></div>

<div class="stage" id="stage">
    <canvas id="game"></canvas>

    <div class="hud">
        <button class="icon-btn hidden" id="pauseBtn" title="暂停 (P)">⏸</button>
        <button class="icon-btn" id="soundBtn" title="音效 (M)">🔊</button>
    </div>

    <div class="overlay" id="readyOverlay">
        <div class="tag">Flappy Bird</div>
        <h1>暮色飞鸟</h1>
        <div class="best-pill">当前难度最佳 <b id="readyBest">0</b></div>
        <div class="chips" id="diffChips">
            <button class="chip" data-diff="easy">悠闲</button>
            <button class="chip on" data-diff="classic">经典</button>
            <button class="chip" data-diff="hard">疾风</button>
        </div>
        <div class="tap-hint">点按屏幕 / 空格 起飞</div>
        <div class="sub-hint">穿过水晶柱的间隙，每过一柱 +1 分<br>天色随分数流转 · <em>P</em> 暂停 · <em>M</em> 静音</div>
        <div class="version">v1.0.0</div>
    </div>

    <div class="overlay hidden" id="overOverlay">
        <div class="panel">
            <h2>坠入暮色</h2>
            <div class="medal none" id="medal">未达标</div>
            <div class="record hidden" id="recordTag">✦ 新纪录 ✦</div>
            <div class="score-rows">
                <div class="score-row"><span>本局得分</span><b id="overScore">0</b></div>
                <div class="score-row best"><span>历史最佳</span><b id="overBest">0</b></div>
            </div>
            <button class="btn primary" id="retryBtn">再来一局</button>
            <button class="btn ghost" id="overMenuBtn">调整难度</button>
        </div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
        <div class="panel">
            <h2>已暂停</h2>
            <button class="btn primary" id="resumeBtn">继续飞行</button>
            <button class="btn ghost" id="pauseRestartBtn">重新开始</button>
            <button class="btn ghost" id="pauseMenuBtn">回到菜单</button>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
