<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>暮色飞鸟 · Flappy Bird</title>
<style>
:root{
    --ink:#0d0820;
    --panel:#171033;
    --amber:#ffd76a;
    --ember:#ff6a3d;
    --magenta:#ff7ab8;
    --cyan:#7af0ff;
    --teal:#17c9b8;
    --acid:#b8ff5e;
    --text:#f4eeff;
    --dim:#b9a8d9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
    background:
        radial-gradient(120% 90% at 50% 110%, rgba(255,106,61,.22), transparent 55%),
        radial-gradient(90% 70% at 15% -10%, rgba(122,240,255,.12), transparent 60%),
        radial-gradient(100% 100% at 85% 20%, rgba(255,122,184,.10), transparent 55%),
        linear-gradient(180deg,#0d0820 0%,#150c30 55%,#1d0f38 100%);
    color:var(--text);
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100svh;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
}
.aurora{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    pointer-events:none;
    animation:drift 16s ease-in-out infinite alternate;
}
.aurora.a1{width:44vw;height:44vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#5b2a86,transparent 70%);}
.aurora.a2{width:38vw;height:38vw;right:-10vw;bottom:-12vw;background:radial-gradient(circle,#86325b,transparent 70%);animation-delay:-8s;}
@keyframes drift{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(4vw,3vw) scale(1.15);}
}
.stage{
    position:relative;
    width:min(100vw, calc(100svh * 0.6667));
    aspect-ratio:480/720;
    max-height:100svh;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(122,240,255,.22);
    box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 60px rgba(91,42,134,.35);
    touch-action:none;
    background:#150c30;
}
@media (max-width:520px){
    .stage{border-radius:0;border:none;box-shadow:0 20px 60px rgba(0,0,0,.6);}
    .aurora{display:none;}
}
canvas{display:block;width:100%;height:100%;}

.hud{
    position:absolute;
    top:12px;left:12px;right:12px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
}
.icon-btn{
    pointer-events:auto;
    width:42px;height:42px;
    border-radius:50%;
    border:1px solid rgba(122,240,255,.35);
    background:rgba(13,8,32,.55);
    backdrop-filter:blur(4px);
    color:var(--text);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    transition:transform .15s, background .15s, box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{background:rgba(23,16,51,.85);box-shadow:0 0 14px rgba(122,240,255,.35);transform:scale(1.06);}
.icon-btn:active{transform:scale(.94);}
.icon-btn.hidden{visibility:hidden;}

.overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:14px;
    z-index:10;
    padding:20px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(122,240,255,.4) rgba(13,8,32,.4);
}
.overlay::-webkit-scrollbar{width:6px;}
.overlay::-webkit-scrollbar-track{background:rgba(13,8,32,.4);}
.overlay::-webkit-scrollbar-thumb{background:rgba(122,240,255,.4);border-radius:3px;}
.overlay.hidden{display:none;}
#readyOverlay{background:linear-gradient(180deg,rgba(13,8,32,.10),rgba(13,8,32,.42));justify-content:flex-end;padding-bottom:9%;}
#overOverlay,#pauseOverlay{background:rgba(10,6,26,.55);backdrop-filter:blur(3px);}

.tag{
    font-size:12px;letter-spacing:.42em;
    color:var(--cyan);
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(122,240,255,.6);
}
h1{
    font-size:clamp(34px,9vw,46px);
    font-weight:900;
    letter-spacing:.08em;
    background:linear-gradient(92deg,var(--amber) 10%,var(--magenta) 55%,var(--cyan) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 4px 18px rgba(255,122,184,.35));
    animation:floaty 3.2s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.best-pill{
    font-size:14px;color:var(--dim);
    border:1px solid rgba(255,215,106,.35);
    background:rgba(255,215,106,.08);
    padding:6px 16px;border-radius:999px;
}
.best-pill b{color:var(--amber);font-size:16px;}
.chips{display:flex;gap:10px;}
.chip{
    padding:9px 20px;
    border-radius:999px;
    border:1px solid rgba(185,168,217,.35);
    background:rgba(23,16,51,.6);
    color:var(--dim);
    font-size:15px;
    cursor:pointer;
    transition:all .18s;
}
.chip:hover{border-color:var(--cyan);color:var(--text);}
.chip.on{
    border-color:var(--cyan);
    color:#06222a;
    background:linear-gradient(135deg,var(--cyan),var(--teal));
    font-weight:700;
    box-shadow:0 0 18px rgba(122,240,255,.45);
}
.tap-hint{
    margin-top:6px;
    font-size:18px;font-weight:700;
    color:var(--text);
    text-shadow:0 2px 10px rgba(0,0,0,.6);
    animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.97);}}
.sub-hint{font-size:12.5px;color:var(--dim);text-align:center;line-height:1.8;}
.sub-hint em{color:var(--acid);font-style:normal;}

.panel{
    width:min(86%,340px);
    background:linear-gradient(165deg,rgba(30,20,62,.96),rgba(19,12,42,.96));
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    padding:26px 24px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    animation:pop .32s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.88);opacity:0;}to{transform:scale(1);opacity:1;}}
.panel h2{font-size:22px;letter-spacing:.12em;color:var(--text);}
.medal{
    width:74px;height:74px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:900;
    border:3px solid rgba(255,255,255,.35);
    box-shadow:0 6px 20px rgba(0,0,0,.5), inset 0 -6px 12px rgba(0,0,0,.3), inset 0 6px 12px rgba(255,255,255,.35);
}
.medal.bronze{background:radial-gradient(circle at 35% 30%,#e8a06a,#9c5a28);color:#4a2408;}
.medal.silver{background:radial-gradient(circle at 35% 30%,#f2f4fa,#9aa3b8);color:#3c4356;}
.medal.gold{background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a1e);color:#5c3a00;}
.medal.plat{background:radial-gradient(circle at 35% 30%,#eaffff,#7ad0e8);color:#0a4a5e;box-shadow:0 0 26px rgba(122,240,255,.7), inset 0 -6px 12px rgba(0,0,0,.2), inset 0 6px 12px rgba(255,255,255,.6);}
.medal.none{background:rgba(255,255,255,.05);border-style:dashed;color:var(--dim);font-size:13px;box-shadow:none;}
.score-rows{width:100%;display:flex;flex-direction:column;gap:8px;}
.score-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:15px;color:var(--dim);
    border-bottom:1px dashed rgba(185,168,217,.2);
    padding-bottom:8px;
}
.score-row b{font-size:30px;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,215,106,.4);}
.score-row.best b{font-size:22px;color:var(--cyan);text-shadow:0 0 14px rgba(122,240,255,.4);}
.record{
    font-size:13px;font-weight:800;letter-spacing:.2em;
    color:#2a1206;
    background:linear-gradient(90deg,var(--amber),var(--ember),var(--amber));
    background-size:200% 100%;
    padding:5px 16px;border-radius:999px;
    animation:shimmer 1.6s linear infinite;
}
.record.hidden{display:none;}
@keyframes shimmer{from{background-position:0 0;}to{background-position:200% 0;}}
.btn{
    width:100%;
    padding:13px;
    border:none;border-radius:13px;
    font-size:17px;font-weight:800;letter-spacing:.1em;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s, filter .15s;
    font-family:inherit;
}
.btn.primary{
    background:linear-gradient(135deg,var(--amber),var(--ember));
    color:#2a1206;
    box-shadow:0 8px 24px rgba(255,106,61,.4);
}
.btn.primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 30px rgba(255,106,61,.55);}
.btn.primary:active{transform:translateY(1px) scale(.98);}
.btn.ghost{
    background:transparent;
    border:1px solid rgba(185,168,217,.4);
    color:var(--dim);
    font-weight:600;
}
.btn.ghost:hover{border-color:var(--cyan);color:var(--text);box-shadow:0 0 14px rgba(122,240,255,.25);}
@media (prefers-reduced-motion:reduce){
    .aurora,h1,.tap-hint,.record,.panel{animation:none;}
}
</style>
</head>
<body>

<div class="aurora a1"></div>
<div class="aurora a2"></div>

<div class="stage" id="stage">
    <canvas id="game"></canvas>

    <div class="hud">
        <button class="icon-btn hidden" id="pauseBtn" title="暂停 (P)">⏸</button>
        <button class="icon-btn" id="soundBtn" title="音效 (M)">🔊</button>
    </div>

    <div class="overlay" id="readyOverlay">
        <div class="tag">Flappy Bird</div>
        <h1>暮色飞鸟</h1>
        <div class="best-pill">当前难度最佳 <b id="readyBest">0</b></div>
        <div class="chips" id="diffChips">
            <button class="chip" data-diff="easy">悠闲</button>
            <button class="chip on" data-diff="classic">经典</button>
            <button class="chip" data-diff="hard">疾风</button>
        </div>
        <div class="tap-hint">点按屏幕 / 空格 起飞</div>
        <div class="sub-hint">穿过水晶柱的间隙，每过一柱 +1 分<br>每 10 分天色流转 · <em>P</em> 暂停 · <em>M</em> 静音</div>
    </div>

    <div class="overlay hidden" id="overOverlay">
        <div class="panel">
            <h2>坠入暮色</h2>
            <div class="medal none" id="medal">未达标</div>
            <div class="record hidden" id="recordTag">✦ 新纪录 ✦</div>
            <div class="score-rows">
                <div class="score-row"><span>本局得分</span><b id="overScore">0</b></div>
                <div class="score-row best"><span>历史最佳</span><b id="overBest">0</b></div>
            </div>
            <button class="btn primary" id="retryBtn">再来一局</button>
            <button class="btn ghost" id="overMenuBtn">调整难度</button>
        </div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
        <div class="panel">
            <h2>已暂停</h2>
            <button class="btn primary" id="resumeBtn">继续飞行</button>
            <button class="btn ghost" id="pauseRestartBtn">重新开始</button>
            <button class="btn ghost" id="pauseMenuBtn">回到菜单</button>
        </div>
    </div>
</div>

<script>
const W = 480, H = 720;
const GROUND_Y = 660;
const BIRD_X = 130, BIRD_R = 13;
const GRAVITY = 1400, FLAP_V = -420, MAX_FALL = 700;
const PIPE_W = 78, STEP = 1/120;

const DIFFS = {
    easy:    {gap:215, gapMin:180, speed:145, speedMax:200, spacing:270},
    classic: {gap:190, gapMin:152, speed:165, speedMax:235, spacing:250},
    hard:    {gap:168, gapMin:136, speed:195, speedMax:265, spacing:235}
};

const PALETTES = [
    {top:[43,26,78],  mid:[122,42,110], low:[255,140,90], far:[58,32,92],  near:[36,20,64],  tree:[22,12,44], ground:[46,26,70],  grass:[122,52,128]},
    {top:[8,12,40],   mid:[24,38,88],   low:[64,92,158],  far:[20,26,64],  near:[12,16,46],  tree:[8,10,32],  ground:[18,22,56],  grass:[48,60,116]},
    {top:[36,58,104], mid:[201,93,138], low:[255,196,107],far:[70,52,110], near:[44,32,80],  tree:[28,18,54], ground:[58,36,88],  grass:[136,66,128]}
];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const readyOverlay = document.getElementById('readyOverlay');
const overOverlay = document.getElementById('overOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
const readyBestEl = document.getElementById('readyBest');
const overScoreEl = document.getElementById('overScore');
const overBestEl = document.getElementById('overBest');
const medalEl = document.getElementById('medal');
const recordTag = document.getElementById('recordTag');

let state = 'ready';
let diff = 'classic';
let bird = {y:300, vy:0, rot:0, wingPhase:0};
let pipes = [];
let particles = [];
let score = 0;
let best = loadBest();
let newRecord = false;
let animT = 0, worldX = 0, groundX = 0;
let shakeT = 0, flashA = 0, scorePop = 0;
let trailAcc = 0;
let overShownAt = 0;
let scale = 1;

const pal = JSON.parse(JSON.stringify(PALETTES[0]));

const stars = [];
for(let i=0;i<64;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H*0.55, r:Math.random()*1.4+0.4, ph:Math.random()*6.28, sp:Math.random()*2+0.6});
}
const fireflies = [];
for(let i=0;i<14;i++){
    fireflies.push({
        x:Math.random()*W, y:120+Math.random()*440,
        ph:Math.random()*6.28, sp:Math.random()*0.5+0.25,
        amp:Math.random()*36+18, green:Math.random()<0.6
    });
}

function makeGlow(color){
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32,32,0,32,32,32);
    grad.addColorStop(0, color);
    grad.addColorStop(0.35, color.replace('1)', '0.5)'));
    grad.addColorStop(1, color.replace('1)', '0)'));
    g.fillStyle = grad;
    g.fillRect(0,0,64,64);
    return c;
}
const glowAmber = makeGlow('rgba(255,200,90,1)');
const glowCyan  = makeGlow('rgba(122,240,255,1)');
const glowGreen = makeGlow('rgba(184,255,94,1)');
const glowWhite = makeGlow('rgba(255,245,230,1)');

function loadBest(){
    return parseInt(localStorage.getItem('flappyBest_' + diff) || '0', 10) || 0;
}
function saveBest(){
    localStorage.setItem('flappyBest_' + diff, String(best));
}

function resize(){
    const rect = canvas.getBoundingClientRect();
    if(rect.width < 1 || rect.height < 1) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    scale = canvas.width / W;
}
window.addEventListener('resize', resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);
resize();

let audioCtx = null, masterGain = null, noiseBuf = null;
let muted = localStorage.getItem('flappyMuted') === '1';

function ensureAudio(){
    if(audioCtx){
        if(audioCtx.state === 'suspended') audioCtx.resume();
        return;
    }
    try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(audioCtx.destination);
        noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for(let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
    }catch(e){
        audioCtx = null;
    }
}
function tone(freq, dur, type, vol, slideTo, delay){
    if(!audioCtx || muted) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g).connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol, filterFreq, delay){
    if(!audioCtx || muted) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = filterFreq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f).connect(g).connect(masterGain);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
}
const sfx = {
    flap(){ tone(480, 0.09, 'triangle', 0.22, 740); },
    score(){ tone(880, 0.08, 'sine', 0.28); tone(1318, 0.12, 'sine', 0.28, null, 0.07); },
    hit(){ noise(0.16, 0.5, 420); tone(110, 0.22, 'sawtooth', 0.4, 55); },
    die(){ tone(420, 0.5, 'sawtooth', 0.18, 70, 0.12); },
    thud(){ noise(0.1, 0.3, 260); },
    medal(){ [523,659,784,1046].forEach((f,i)=>tone(f, 0.14, 'sine', 0.24, null, i*0.09)); }
};
function syncSoundBtn(){
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.setAttribute('aria-pressed', String(!muted));
}
function toggleMute(){
    muted = !muted;
    localStorage.setItem('flappyMuted', muted ? '1' : '0');
    if(masterGain) masterGain.gain.value = muted ? 0 : 1;
    syncSoundBtn();
}
syncSoundBtn();

function spawnParticle(x, y, vx, vy, life, size, sprite, grav){
    if(particles.length >= 300) particles.shift();
    particles.push({x, y, vx, vy, life, maxLife:life, size, sprite, grav:grav||0});
}
function flapBurst(){
    for(let i=0;i<6;i++){
        spawnParticle(BIRD_X-6, bird.y+8,
            -40-Math.random()*70, 60+Math.random()*90,
            0.4+Math.random()*0.2, 7+Math.random()*6, glowAmber, 0);
    }
}
function scoreBurst(x, y){
    for(let i=0;i<12;i++){
        const a = Math.random()*6.28, sp = 60+Math.random()*140;
        spawnParticle(x, y, Math.cos(a)*sp, Math.sin(a)*sp,
            0.5+Math.random()*0.3, 6+Math.random()*7,
            Math.random()<0.5 ? glowCyan : glowWhite, 120);
    }
}
function deathBurst(){
    for(let i=0;i<26;i++){
        const a = Math.random()*6.28, sp = 80+Math.random()*240;
        spawnParticle(BIRD_X, bird.y, Math.cos(a)*sp, Math.sin(a)*sp-60,
            0.6+Math.random()*0.5, 6+Math.random()*10,
            Math.random()<0.6 ? glowAmber : glowWhite, 320);
    }
}

function currentGap(){
    const d = DIFFS[diff];
    return Math.max(d.gapMin, d.gap - score*1.1);
}
function currentSpeed(){
    const d = DIFFS[diff];
    return Math.min(d.speedMax, d.speed + score*2.2);
}
function spawnPipe(x){
    const gap = currentGap();
    const minC = 90 + gap/2;
    const maxC = GROUND_Y - 90 - gap/2;
    let center = minC + Math.random()*(maxC-minC);
    const last = pipes[pipes.length-1];
    if(last){
        const prevC = last.gapY;
        center = Math.max(prevC-180, Math.min(prevC+180, center));
        center = Math.max(minC, Math.min(maxC, center));
    }
    pipes.push({x, gapY:center, gap, passed:false});
}
function resetRun(){
    pipes = [];
    particles = [];
    score = 0;
    newRecord = false;
    bird.y = 300; bird.vy = 0; bird.rot = 0;
    shakeT = 0; flashA = 0; scorePop = 0; trailAcc = 0;
    spawnPipe(W + 160);
}
function showOverlay(which){
    readyOverlay.classList.toggle('hidden', which !== 'ready');
    overOverlay.classList.toggle('hidden', which !== 'over');
    pauseOverlay.classList.toggle('hidden', which !== 'pause');
    pauseBtn.classList.toggle('hidden', state !== 'play');
}
function toReady(){
    state = 'ready';
    resetRun();
    pipes = [];
    best = loadBest();
    readyBestEl.textContent = best;
    showOverlay('ready');
}
function startGame(){
    ensureAudio();
    resetRun();
    state = 'play';
    showOverlay(null);
    flap();
}
function flap(){
    bird.vy = FLAP_V;
    bird.wingPhase = -Math.PI/2;
    flapBurst();
    sfx.flap();
}
function die(){
    state = 'dying';
    bird.vy = -260;
    shakeT = 0.5;
    flashA = 0.85;
    deathBurst();
    sfx.hit();
    sfx.die();
    pauseBtn.classList.add('hidden');
}
function finishRun(){
    state = 'over';
    overShownAt = performance.now();
    if(score > best){
        best = score;
        newRecord = score > 0;
        saveBest();
    }
    overScoreEl.textContent = score;
    overBestEl.textContent = best;
    recordTag.classList.toggle('hidden', !newRecord);
    let tier, label;
    if(score >= 40){ tier='plat'; label='铂'; }
    else if(score >= 30){ tier='gold'; label='金'; }
    else if(score >= 20){ tier='silver'; label='银'; }
    else if(score >= 10){ tier='bronze'; label='铜'; }
    else { tier='none'; label='未达标'; }
    medalEl.className = 'medal ' + tier;
    medalEl.textContent = label;
    if(tier !== 'none') sfx.medal();
    showOverlay('over');
}
function pauseGame(){
    if(state !== 'play') return;
    state = 'pause';
    showOverlay('pause');
}
function resumeGame(){
    if(state !== 'pause') return;
    state = 'play';
    showOverlay(null);
}

function circleHitsRect(cx, cy, r, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-nx, dy = cy-ny;
    return dx*dx + dy*dy < r*r;
}

function stepPlay(dt){
    const speed = currentSpeed();
    worldX += speed*dt;
    groundX += speed*dt;

    bird.vy = Math.min(bird.vy + GRAVITY*dt, MAX_FALL);
    bird.y += bird.vy*dt;
    bird.wingPhase += dt*18;
    if(bird.y < BIRD_R){ bird.y = BIRD_R; bird.vy = 0; }
    const targetRot = Math.max(-0.45, Math.min(1.3, bird.vy/620));
    bird.rot += (targetRot - bird.rot)*Math.min(1, dt*10);

    trailAcc += dt;
    if(trailAcc > 0.035){
        trailAcc = 0;
        spawnParticle(BIRD_X-12, bird.y+4, -speed*0.4, 20+Math.random()*30,
            0.35, 6+Math.random()*4, glowAmber, 0);
    }

    for(const p of pipes) p.x -= speed*dt;
    while(pipes.length && pipes[0].x < -PIPE_W-20) pipes.shift();
    const last = pipes[pipes.length-1];
    if(!last || last.x < W - DIFFS[diff].spacing) spawnPipe(last ? last.x + DIFFS[diff].spacing : W+40);

    const r = BIRD_R - 2;
    for(const p of pipes){
        const topH = p.gapY - p.gap/2;
        const botY = p.gapY + p.gap/2;
        if(circleHitsRect(BIRD_X, bird.y, r, p.x, -50, PIPE_W, topH+50) ||
           circleHitsRect(BIRD_X, bird.y, r, p.x, botY, PIPE_W, GROUND_Y-botY)){
            die();
            return;
        }
        if(!p.passed && p.x + PIPE_W < BIRD_X){
            p.passed = true;
            score++;
            scorePop = 1;
            scoreBurst(p.x + PIPE_W/2, p.gapY);
            sfx.score();
        }
    }
    if(bird.y + BIRD_R >= GROUND_Y){
        bird.y = GROUND_Y - BIRD_R;
        die();
    }
}
function stepDying(dt){
    bird.vy = Math.min(bird.vy + GRAVITY*dt, MAX_FALL);
    bird.y += bird.vy*dt;
    bird.rot = Math.min(bird.rot + dt*5, Math.PI/2);
    if(bird.y >= GROUND_Y - BIRD_R){
        bird.y = GROUND_Y - BIRD_R;
        shakeT = Math.max(shakeT, 0.25);
        sfx.thud();
        finishRun();
    }
}
function step(dt){
    animT += dt;
    if(state === 'ready'){
        worldX += 45*dt;
        groundX += 45*dt;
        bird.y = 300 + Math.sin(animT*2.4)*10;
        bird.rot = Math.sin(animT*2.4)*0.08;
        bird.wingPhase += dt*7;
    }else if(state === 'play'){
        stepPlay(dt);
    }else if(state === 'dying'){
        stepDying(dt);
    }else if(state === 'over'){
        worldX += 18*dt;
        groundX += 18*dt;
    }

    const targetIdx = score >= 25 ? 2 : score >= 10 ? 1 : 0;
    const target = PALETTES[targetIdx];
    const k = 1 - Math.exp(-dt*1.4);
    for(const key in pal){
        for(let i=0;i<3;i++) pal[key][i] += (target[key][i]-pal[key][i])*k;
    }

    for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.life -= dt;
        if(p.life <= 0){ particles.splice(i,1); continue; }
        p.vy += p.grav*dt;
        p.x += p.vx*dt;
        p.y += p.vy*dt;
    }
    shakeT = Math.max(0, shakeT - dt);
    flashA = Math.max(0, flashA - dt*2.6);
    scorePop = Math.max(0, scorePop - dt*3);
}

function rgb(c){ return 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')'; }
function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
}
function drawGlow(sprite, x, y, size, alpha){
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprite, x-size/2, y-size/2, size, size);
    ctx.globalAlpha = 1;
}
function ridge(offset, base, a1, f1, a2, f2, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for(let x=0;x<=W;x+=8){
        const wx = x + offset;
        const y = base + Math.sin(wx*f1)*a1 + Math.sin(wx*f2+1.7)*a2;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
}
function drawCrystalColumn(x, y, h, capAtBottom){
    if(h <= 0) return;
    const grad = ctx.createLinearGradient(x, 0, x+PIPE_W, 0);
    grad.addColorStop(0, '#0b4f5e');
    grad.addColorStop(0.2, '#17c9b8');
    grad.addColorStop(0.5, '#0e8fa0');
    grad.addColorStop(0.82, '#0a5f78');
    grad.addColorStop(1, '#063a52');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, PIPE_W, h);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x+PIPE_W*0.28, y, 3, h);
    ctx.fillStyle = 'rgba(6,30,50,0.35)';
    ctx.fillRect(x+PIPE_W*0.62, y, 5, h);

    const capH = 26, capX = x-5, capW = PIPE_W+10;
    const capY = capAtBottom ? y : y+h-capH;
    ctx.fillStyle = grad;
    rr(capX, capY, capW, capH, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(174,247,255,0.5)';
    ctx.lineWidth = 1.5;
    rr(capX, capY, capW, capH, 8);
    ctx.stroke();

    const edgeY = capAtBottom ? capY+2 : capY+capH-2;
    ctx.save();
    ctx.shadowColor = '#7af0ff';
    ctx.shadowBlur = 14;
    ctx.strokeStyle = '#aef7ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(capX+6, edgeY);
    ctx.lineTo(capX+capW-6, edgeY);
    ctx.stroke();
    ctx.restore();
}
function drawBird(){
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(glowAmber, 0, 0, 74, 0.5);
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#ff8a3c';
    ctx.beginPath();
    ctx.moveTo(-13, -2);
    ctx.lineTo(-22, -7);
    ctx.lineTo(-20, 3);
    ctx.closePath();
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(-4, -5, 2, 0, 0, 17);
    bodyGrad.addColorStop(0, '#ffe9a0');
    bodyGrad.addColorStop(0.55, '#ffd76a');
    bodyGrad.addColorStop(1, '#ff9d3c');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 13, 0, 0, 6.29);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,50,10,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#fff3d6';
    ctx.beginPath();
    ctx.ellipse(2, 6, 8, 5.5, 0, 0, 6.29);
    ctx.fill();

    const wingA = Math.sin(bird.wingPhase)*0.85;
    ctx.save();
    ctx.translate(-3, -1);
    ctx.rotate(wingA);
    ctx.fillStyle = '#ff7a3c';
    ctx.beginPath();
    ctx.ellipse(-4, 0, 9, 5.5, -0.3, 0, 6.29);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,50,10,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 4.6, 0, 6.29);
    ctx.fill();
    ctx.fillStyle = '#241436';
    ctx.beginPath();
    ctx.arc(8.4, -5, 2.3, 0, 6.29);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(9.2, -5.9, 0.9, 0, 6.29);
    ctx.fill();

    ctx.fillStyle = '#ff5e3a';
    ctx.beginPath();
    ctx.moveTo(13, -1);
    ctx.lineTo(22, 1.5);
    ctx.lineTo(13, 4.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}
function render(){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if(shakeT > 0){
        const m = shakeT*14;
        ctx.translate((Math.random()-0.5)*2*m, (Math.random()-0.5)*2*m);
    }

    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, rgb(pal.top));
    sky.addColorStop(0.55, rgb(pal.mid));
    sky.addColorStop(1, rgb(pal.low));
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, W+40, H+40);

    const starA = Math.max(0.25, Math.min(1, 1.3 - (pal.top[0]+pal.top[1]+pal.top[2])/220));
    ctx.fillStyle = '#fff';
    for(const s of stars){
        ctx.globalAlpha = starA*(0.35 + 0.65*Math.abs(Math.sin(animT*s.sp + s.ph)));
        ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(glowWhite, W-88, 96, 150, 0.55);
    ctx.restore();
    ctx.fillStyle = '#fdf3d8';
    ctx.beginPath();
    ctx.arc(W-88, 96, 26, 0, 6.29);
    ctx.fill();
    ctx.fillStyle = 'rgba(190,170,140,0.35)';
    ctx.beginPath(); ctx.arc(W-96, 90, 5, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(W-80, 104, 3.5, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(W-84, 88, 2.5, 0, 6.29); ctx.fill();

    ridge(worldX*0.15, 430, 46, 0.008, 22, 0.021, rgb(pal.far));
    ridge(worldX*0.3, 510, 38, 0.012, 18, 0.03, rgb(pal.near));

    ctx.fillStyle = rgb(pal.tree);
    const treeOff = (worldX*0.5) % 90;
    for(let x=-treeOff-90; x<W+90; x+=90){
        const h = 60 + ((Math.abs(Math.sin(x*13.7))*40)|0);
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x+22, GROUND_Y-h);
        ctx.lineTo(x+44, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x+34, GROUND_Y);
        ctx.lineTo(x+52, GROUND_Y-h*0.66);
        ctx.lineTo(x+70, GROUND_Y);
        ctx.closePath();
        ctx.fill();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const f of fireflies){
        const fx = f.x + Math.sin(animT*f.sp + f.ph)*f.amp;
        const fy = f.y + Math.cos(animT*f.sp*0.8 + f.ph)*f.amp*0.6;
        const a = 0.25 + 0.55*Math.pow(Math.sin(animT*1.6 + f.ph), 2);
        drawGlow(f.green ? glowGreen : glowAmber, fx, fy, 16, a);
    }
    ctx.restore();

    for(const p of pipes){
        const topH = p.gapY - p.gap/2;
        const botY = p.gapY + p.gap/2;
        drawCrystalColumn(p.x, 0, topH, false);
        drawCrystalColumn(p.x, botY, GROUND_Y-botY, true);
    }

    ctx.fillStyle = rgb(pal.ground);
    ctx.fillRect(-20, GROUND_Y, W+40, H-GROUND_Y+20);
    const grassGrad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y+14);
    grassGrad.addColorStop(0, rgb(pal.grass));
    grassGrad.addColorStop(1, rgb(pal.ground));
    ctx.fillStyle = grassGrad;
    ctx.fillRect(-20, GROUND_Y, W+40, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    const gOff = groundX % 36;
    for(let x=-gOff-36; x<W+36; x+=36){
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y+14);
        ctx.lineTo(x+14, GROUND_Y);
        ctx.lineTo(x+22, GROUND_Y);
        ctx.lineTo(x+8, GROUND_Y+14);
        ctx.closePath();
        ctx.fill();
    }
    ctx.fillStyle = 'rgba(122,240,255,0.25)';
    ctx.fillRect(-20, GROUND_Y-1, W+40, 2);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const p of particles){
        const a = p.life/p.maxLife;
        drawGlow(p.sprite, p.x, p.y, p.size*(0.5+a), a*0.9);
    }
    ctx.restore();

    drawBird();

    if(state === 'play' || state === 'dying' || state === 'pause'){
        const s = 1 + scorePop*0.35;
        ctx.save();
        ctx.translate(W/2, 108);
        ctx.scale(s, s);
        ctx.font = '900 62px "Arial Black",Arial,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(13,8,32,0.75)';
        ctx.strokeText(score, 0, 0);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(255,215,106,0.8)';
        ctx.shadowBlur = 18;
        ctx.fillText(score, 0, 0);
        ctx.restore();
    }

    if(flashA > 0){
        ctx.fillStyle = 'rgba(255,240,225,' + flashA.toFixed(3) + ')';
        ctx.fillRect(-20, -20, W+40, H+40);
    }

    const vig = ctx.createRadialGradient(W/2, H/2, H*0.36, W/2, H/2, H*0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(8,4,20,0.42)');
    ctx.fillStyle = vig;
    ctx.fillRect(-20, -20, W+40, H+40);
}

let last = performance.now(), acc = 0;
function frame(now){
    requestAnimationFrame(frame);
    let dt = (now - last)/1000;
    last = now;
    if(dt > 0.05) dt = 0.05;
    if(state !== 'pause'){
        acc += dt;
        while(acc >= STEP){
            step(STEP);
            acc -= STEP;
        }
    }
    render();
}
requestAnimationFrame(frame);

function primaryAction(){
    ensureAudio();
    if(state === 'ready') startGame();
    else if(state === 'play') flap();
    else if(state === 'pause') resumeGame();
    else if(state === 'over' && performance.now() - overShownAt > 600) startGame();
}
stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('button')) return;
    primaryAction();
});
document.addEventListener('keydown', e=>{
    if(e.repeat) return;
    if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
        e.preventDefault();
        primaryAction();
    }else if(e.code === 'KeyP'){
        if(state === 'play') pauseGame();
        else if(state === 'pause') resumeGame();
    }else if(e.code === 'KeyM'){
        toggleMute();
    }else if(e.code === 'Enter' && state === 'over'){
        if(performance.now() - overShownAt > 600) startGame();
    }
});
document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && state === 'play') pauseGame();
});

pauseBtn.addEventListener('click', pauseGame);
soundBtn.addEventListener('click', toggleMute);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('overMenuBtn').addEventListener('click', toReady);
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('pauseRestartBtn').addEventListener('click', startGame);
document.getElementById('pauseMenuBtn').addEventListener('click', toReady);
document.getElementById('diffChips').addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    diff = chip.dataset.diff;
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c === chip));
    best = loadBest();
    readyBestEl.textContent = best;
});

toReady();
</script>
